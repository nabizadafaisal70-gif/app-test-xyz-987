<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Nabizada Vocabulary Hub</title>
<style>
:root{
  --blue:#0ea5e9; --blue-deep:#0369a1; --gold:#f59e0b; --soft:#e0f2fe; --gold-soft:#fef3c7;
  --bg:#F2F2F7; --card:#FFFFFF; --text:#0f172a; --muted:#64748b; --line:rgba(60,60,67,.12); --line-2:rgba(60,60,67,.22);
  --glass:rgba(255,255,255,.62); --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989f; --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.18);
  --soft:rgba(14,165,233,.16); --gold-soft:rgba(245,158,11,.16); --glass:rgba(44,44,48,.6);
  --shadow:0 0 0 .5px rgba(255,255,255,.06),0 10px 26px rgba(0,0,0,.5); color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989f; --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.18);
    --soft:rgba(14,165,233,.16); --gold-soft:rgba(245,158,11,.16); --glass:rgba(44,44,48,.6);
    --shadow:0 0 0 .5px rgba(255,255,255,.06),0 10px 26px rgba(0,0,0,.5); color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;min-height:100vh;min-height:100dvh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
svg.i{width:22px;height:22px;display:block;flex-shrink:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(70vw 45vh at 0% -10%,rgba(14,165,233,.14),transparent 60%),radial-gradient(60vw 40vh at 100% 0%,rgba(245,158,11,.10),transparent 60%)}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line)}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-block:76px 150px}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);width:min(100%,760px);height:60px;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-width:0 0 1px;border-radius:0 0 22px 22px}
.brand{display:flex;align-items:center;gap:9px;direction:ltr;min-width:0;font-size:15px;white-space:nowrap}
.brand b{color:var(--blue);font-weight:900;letter-spacing:.02em}
.brand .sep{width:1px;height:16px;background:var(--line-2)}
.brand span{font-weight:600}
.langs{display:flex;background:var(--line);border-radius:999px;padding:3px;flex-shrink:0}
.pill{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.pill.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.tabbar{position:fixed;bottom:env(safe-area-inset-bottom,0px);left:50%;transform:translateX(-50%);width:min(100%,760px);z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 8px 10px;border-width:1px 0 0;border-radius:22px 22px 0 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--muted);font-size:12px;font-weight:600;border-radius:14px;min-width:0}
.tab svg.i{width:24px;height:24px}
.tab.on{color:var(--blue)}
.tab span{white-space:nowrap}
.card{background:var(--card);border:.5px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0;position:relative}
.hello{font-size:20px;font-weight:800;margin-bottom:12px;line-height:1.5}
.hero-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hero-head .hello{flex:1;min-width:0;margin:0}
.chev{width:32px;height:32px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex-shrink:0}
.chev svg.i{width:18px;height:18px}
.hero-mini{display:flex;align-items:center;gap:10px}
.hero-mini b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.hero-mini .bar{flex:1;max-width:120px;height:6px}
.hero-mini .pct{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:0}
.muted{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .4s}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:16px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;margin-top:12px;text-align:center}
.btn.ghost{background:var(--soft);color:var(--blue-deep)}
.btn.danger{background:#ef4444}
.btn.sm{width:auto;margin-top:0;padding:9px 14px;font-size:14px;border-radius:14px}
.btn.sm svg.i{width:18px;height:18px}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:24px 6px 8px;text-transform:uppercase;letter-spacing:.04em}
.review{display:flex;align-items:center;gap:14px;margin-top:12px;cursor:pointer}
.ico{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--blue-deep);display:grid;place-items:center;flex-shrink:0}
.review b{display:block;font-size:16px}
.book{display:flex;align-items:center;gap:14px;cursor:pointer;margin-bottom:10px}
.badge{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;flex-shrink:0;direction:ltr;background:linear-gradient(135deg,var(--blue),#38bdf8)}
.badge.gold{background:linear-gradient(135deg,var(--gold),#fbbf24);color:#422006}
.badge.navy{background:linear-gradient(135deg,#1e3a8a,var(--blue))}
.book h3{font-size:16px;direction:ltr;text-align:start}
.book p{color:var(--muted);font-size:13px;direction:ltr;text-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.tile{position:relative;text-align:center;padding:14px 10px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);direction:ltr;display:block;width:100%}
.tile b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.dot{position:absolute;top:11px;inset-inline-end:11px;width:9px;height:9px;border-radius:50%;background:#94a3b8}
.dot.blue{background:var(--blue)}.dot.amber{background:var(--gold)}.dot.green{background:#22c55e}
.page-head{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.page-head h2{font-size:17px;font-weight:800;direction:ltr;text-align:start;flex:1;min-width:0}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--line);flex-shrink:0}
.mascot{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.word-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;min-width:0}
.num{min-width:46px;height:28px;padding:0 8px;border-radius:999px;background:var(--soft);color:var(--blue-deep);font-weight:800;font-size:13px;display:grid;place-items:center;flex-shrink:0;direction:ltr;font-variant-numeric:tabular-nums}
.wt{flex:1;min-width:0;direction:ltr;text-align:start}
.wt b{display:block;font-size:17px}
.wt small{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--blue-deep);flex-shrink:0}
.mini.on{background:var(--gold-soft);color:#b45309}
.tick{color:#16a34a;flex-shrink:0}
/* 3D image cards */
.art{width:112px;height:112px;margin:0 auto 4px;display:grid;place-items:center;border-radius:26px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--shadow);animation:float 4s ease-in-out infinite}
.art img{width:76px;height:76px;object-fit:contain;display:block}
.art.sm{width:84px;height:84px;border-radius:22px;margin:0;animation:none}
.art.sm img{width:60px;height:60px}
.mono{width:72px;height:72px;border-radius:50%;background:var(--soft);color:var(--blue-deep);display:grid;place-items:center;font-size:30px;font-weight:900}
.art.sm .mono{width:52px;height:52px;font-size:22px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.study-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.study-top .bar{flex:1}
.study-top .cnt{font-size:13px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;min-width:42px;text-align:center}
.corner{position:absolute;top:12px;inset-inline-end:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);color:transparent;transition:background .2s,border-color .2s,color .2s}
.corner.ok{background:#22c55e;border-color:#22c55e;color:#fff}
.corner svg.i{width:18px;height:18px}
.scard{text-align:center}
.word{font-size:clamp(34px,9vw,46px);font-weight:800;letter-spacing:-.02em;direction:ltr;margin-top:6px;line-height:1.2}
.pos{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--soft);color:var(--blue-deep);direction:ltr;margin-top:8px}
.phon{color:var(--muted);font-size:18px;direction:ltr;margin-top:6px}
.audio{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.aud{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:14px;background:var(--soft);color:var(--blue-deep);font-weight:600;font-size:14px;direction:ltr}
.aud svg.i{width:18px;height:18px}
.box{background:var(--soft);border-radius:18px;padding:14px 16px;text-align:start;margin-top:12px}
.lbl{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.05em;margin:6px 0 2px}
.def{font-size:17px;direction:ltr;text-align:start}
.tr{font-size:16px;margin-top:2px}
.exs{margin-top:16px;text-align:start}
.ex{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;min-width:0}
.ex-body{flex:1;min-width:0}
.ex .en{direction:ltr;text-align:start;font-size:16px}
.ex .tr{font-size:15px;color:var(--muted);margin-top:4px}
.study-actions{display:flex;gap:10px;margin-top:14px}
.study-actions .bm{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:700}
.study-actions .bm.on{color:#b45309;background:var(--gold-soft)}
.study-actions .btn{flex:1.4;margin-top:0}
.study-actions .rep{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:14px;border-radius:16px;background:var(--card);border:.5px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
.empty{text-align:center;padding:36px 18px}
.empty .ico{margin:0 auto 12px;width:64px;height:64px;border-radius:22px}
.field{display:flex;gap:10px;align-items:center;margin-top:8px}
.field input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line-2);background:var(--bg);font-size:16px}
.switch{width:51px;height:31px;border-radius:999px;background:var(--line-2);position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:#34c759}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.story{font-size:18px;line-height:1.9}
.story-en{direction:ltr;text-align:start;font-size:17px;line-height:1.9}
.story-tr{direction:rtl;text-align:start;font-size:16px;line-height:1.9;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted)}
.kw{background:var(--gold-soft);color:var(--text);font-weight:800;padding:0 3px;border-radius:6px;font-style:normal}
.story-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.check-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;border-bottom:1px solid var(--line);text-align:start;font-size:15px}
.check-item:last-child{border-bottom:0}
.cbox{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex-shrink:0;color:#fff}
.cbox.on{background:var(--blue);border-color:var(--blue)}
.cbox svg.i{width:16px;height:16px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,380px);max-height:80vh;overflow:auto;z-index:50;border-radius:24px;padding:20px;background:var(--card);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:6px}
.sheet p{color:var(--muted);font-size:15px}
.sheet ul{margin:10px 0 0;padding:0;list-style:none}
.sheet li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:15px}
.sheet li svg.i{width:18px;height:18px;color:var(--blue);margin-top:3px}
.sheet-btns{display:flex;gap:10px;margin-top:16px}
.sheet-btns .btn{margin-top:0}
.quiz-word{font-size:clamp(34px,9vw,44px);font-weight:800;direction:ltr;text-align:center;margin:8px 0 4px;line-height:1.2}
.opt{display:block;width:100%;text-align:start;padding:14px 16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line-2);font-size:15px;margin-top:10px;direction:ltr;line-height:1.5;transition:background .2s,border-color .2s}
.opt.right{background:rgba(34,197,94,.18);border-color:#22c55e}
.opt.wrong{background:rgba(239,68,68,.16);border-color:#ef4444}
.opt:disabled{cursor:default}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:start;min-width:0}
.tcard b{font-size:15px;line-height:1.4}
.tcard small{color:var(--muted);font-size:12px}
.qrow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:start;min-width:0}
.qrow .wt{direction:inherit;text-align:start}
.qrow .wt b{font-size:15px}
.tagf{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(34,197,94,.16);color:#16a34a;flex-shrink:0}
.crown{color:#d97706;flex-shrink:0;display:grid;place-items:center}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.stat small{color:var(--muted);font-size:13px}
.chart{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:6px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col i{display:block;width:100%;max-width:30px;border-radius:9px;background:var(--soft)}
.col.today i{background:linear-gradient(180deg,var(--blue),#38bdf8)}
.col em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums;min-height:16px}
.col span{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap}
.col.today span{color:var(--blue-deep);font-weight:800}
.toast{position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);opacity:0;pointer-events:none;z-index:60;padding:10px 16px;border-radius:16px;max-width:calc(100% - 32px);text-align:center;font-weight:700;font-size:14px;transition:opacity .25s,transform .25s;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){.app{padding-block:84px 150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div id="app"></div>
<div id="toast" class="toast glass" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ---------- Storage (same key as v4, so progress is kept) ---------- */
var KEY = "nabizada_vocab_v4";
var S = {};
var R = { tab:"home", page:null, modal:null, reportSel:[], storyTr:false, playing:false, quiz:null, qrun:null };

function newId(){ return "NOA-" + String(10000 + Math.floor(Math.random() * 89999)); }
function loadState(){
  var s = {};
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { s = {}; }
  return {
    name: typeof s.name === "string" ? s.name : "",
    id: s.id || newId(),
    score: typeof s.score === "number" ? s.score : 0,
    learned: s.learned || {},
    awarded: s.awarded || {},
    bookmarks: s.bookmarks || {},
    daily: s.daily || {},
    quizzesDone: typeof s.quizzesDone === "number" ? s.quizzesDone : 0,
    done1: !!s.done1,
    lang: (s.lang === "en" || s.lang === "ps") ? s.lang : "fa",
    theme: s.theme === "dark" ? "dark" : "light"
  };
}
function saveState(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: work in memory */ }
}
function esc(v){
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ---------- Icons (UI only, stroke SVG, no emoji) ---------- */
function svg(path){
  return '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+path+'</svg>';
}
var IC = {
  home:  svg('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'),
  quiz:  svg('<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>'),
  stats: svg('<path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/>'),
  user:  svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'),
  speaker: svg('<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'),
  female: svg('<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>'),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  flag:  svg('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
  bookmark: svg('<path d="M6 4h12v17l-6-4-6 4z"/>'),
  bookmarkOn: '<svg class="i" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg>',
  x:     svg('<path d="M6 6l12 12M18 6L6 18"/>'),

function bindFallbacks(){
  var imgs = document.querySelectorAll("img[data-fb]");
  for (var k=0;k<imgs.length;k++){
    (function(img){
      function fail(){
        if (!img.parentNode) return;
        var span = document.createElement("span");
        span.className = "mono";
        span.textContent = img.getAttribute("data-fb");
        img.parentNode.replaceChild(span, img);
      }
      img.addEventListener("error", fail);
      if (img.complete && img.naturalWidth === 0) fail();
    })(imgs[k]);
  }
}

function awardPts(key, pts, msg){
  if (!S.awarded[key]){
    S.awarded[key] = true;
    S.score += pts;
    if (msg) toast(msg);
  }
}
function markLearned(key){
  if (S.learned[key]) return;
  S.learned[key] = true;
  awardPts(key, 2, null);
  var dk = dayKey(new Date());
  S.daily[dk] = (S.daily[dk] || 0) + 1;
}
function dayKey(d){ return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
/* Week runs Saturday to Friday. */
function weekDays(){
  var now = new Date();
  var dow = (now.getDay() + 1) % 7;
  var todayKey = dayKey(now);
  var out = [];
  for (var i=0;i<7;i++){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow + i);
    var k = dayKey(d);
    out.push({ key:k, today:k === todayKey });
  }
  return out;
}
function shuffle(arr){
  for (var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random() * (i+1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

/* ---------- Audio ----------
   playWord(): uses a dedicated recording when one is attached to the word
   (audioUrlFemale / audioUrlMale); otherwise falls back to the browser's speech voice.
   Every path fails silently, so no error text is ever shown. */
function voiceFor(lang){
  var vs = [];
  try { vs = window.speechSynthesis.getVoices() || []; } catch (e) { vs = []; }
  var exact = null, loose = null;
  for (var i=0;i<vs.length;i++){
    var vl = String(vs[i].lang || "").replace("_","-");
    if (!exact && vl === lang) exact = vs[i];
    if (!loose && vl.indexOf("en") === 0) loose = vs[i];
  }
  return exact || loose || null;
}
var VOICE = {
  female: { lang:"en-US", rate:0.95, pitch:1.2 },
  male:   { lang:"en-US", rate:0.9,  pitch:0.85 },
  slow:   { lang:"en-US", rate:0.7,  pitch:1 },
  ex:     { lang:"en-US", rate:0.9,  pitch:1 },
  story:  { lang:"en-US", rate:0.85, pitch:1 }
};
function speak(text, acc, onEnd){
  try {
    if (!window.speechSynthesis || typeof window.SpeechSynthesisUtterance === "undefined" || !text){ if (onEnd) onEnd(); return; }
    window.speechSynthesis.cancel();
    var cfg = VOICE[acc] || VOICE.ex;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = cfg.lang; u.rate = cfg.rate; u.pitch = cfg.pitch;
    var v = voiceFor(cfg.lang);
    if (v) u.voice = v;
    u.onend = function(){ if (onEnd) onEnd(); };
    u.onerror = function(){ if (onEnd) onEnd(); };
    window.speechSynthesis.speak(u);
  } catch (e) { if (onEnd) onEnd(); }
}
function stopAudio(){
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
}
function playWord(w, acc){
  var item = findItem(w);
  var url = null;
  if (acc === "female" || acc === "male"){
    url = item && (acc === "female" ? item.audioUrlFemale : item.audioUrlMale);
    if (!url) url = "audio/" + acc + "/" + String(w).toLowerCase() + ".mp3";
  }
  if (url){
    try {
      var a = new Audio(url);
      a.onerror = function(){ speak(w, acc); };
      var p = a.play();
      if (p && p.catch) p.catch(function(){ speak(w, acc); });
      return;
    } catch (e) { /* fall through to speech */ }
  }
  speak(w, acc);
}

}

/* ---------- Renderers: Home review quiz (4 options, wrong answers return to queue) ---------- */
function questionFor(idx, retry){
  var others = [];
  for (var j=0;j<LESSON1.length;j++) if (j !== idx) others.push(j);
  shuffle(others);
  var choices = [idx].concat(others.slice(0,3));
  shuffle(choices);
  return {
    idx: idx,
    retry: !!retry,
    options: choices.map(function(c){ return optionText(LESSON1[c]); }),
    correct: choices.indexOf(idx),
    answered: null
  };
}
function buildQuiz(){
  var pool = [];
  for (var i=0;i<LESSON1.length;i++){
    if (S.learned[lessonKey(1,i)] || S.bookmarks[lessonKey(1,i)]) pool.push(i);
  }
  if (!pool.length) return null;
  shuffle(pool);
  var queue = pool.map(function(idx){ return questionFor(idx, false); });
  return { queue:queue, pos:0, total:pool.length, solved:0, firstTry:0, wrong:0, done:false };
}
function quizPage(){
  var t = T();
  var q = R.quiz;
  if (!q) return homePage();
  if (q.done) return quizEnd();
  var cur = q.queue[q.pos];
  var item = LESSON1[cur.idx];
  var pct = Math.round(q.solved / q.total * 100);
  var opts = cur.options.map(function(o,k){
    var cls = "";
    if (cur.answered !== null){
      if (k === cur.correct) cls = "right";
      else if (k === cur.answered) cls = "wrong";
    }
    return '<button class="opt '+cls+'" data-act="quiz-ans" data-v="'+k+'" '+(cur.answered!==null?'disabled':'')+'>'+esc(o)+'</button>';
  }).join("");
  return '<div class="study-top">'
    + '<button class="icon-btn" data-act="back-home" aria-label="'+esc(t.back)+'">'+IC.x+'</button>'
    + '<div class="bar"><i style="width:'+pct+'%"></i></div>'
    + '<span class="cnt">'+q.solved+'/'+q.total+'</span>'
    + '</div>'
    + '<section class="card scard">'
    + '<div class="lbl">'+esc(t.quizTitle)+'</div>'
    + '<h1 class="quiz-word">'+esc(item.w)+'</h1>'
    + '<div><span class="pos">'+esc(item.pos)+'</span></div>'
    + '<div style="margin-top:8px">'+opts+'</div>'
    + '</section>'
    + (cur.answered !== null ? '<button class="btn" data-act="quiz-next">'+esc(q.pos+1 < q.queue.length ? t.nextQ : t.seeResult)+'</button>' : '');
}

    var benefits = [
      { en:"All quizzes and all levels", fa:"همه آزمون‌ها و همه سطح‌ها", ps:"ټولې ازموینې او ټولې کچې" },
      { en:"Full 504 and 1100 word books", fa:"کتاب‌های کامل ۵۰۴ و ۱۱۰۰ کلمه", ps:"د ۵۰۴ او ۱۱۰۰ لغاتو بشپړ کتابونه" }
    ];
    var bl = benefits.map(function(b){
      return '<li>'+IC.check+'<span>'+esc(L(b))+'</span></li>';
    }).join("");
    return '<div class="scrim" data-act="modal-stay"></div>'
      + '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">'
      + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="crown" style="width:36px;height:36px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center">'+IC.crown+'</span><h3 id="mt" style="margin:0">'+esc(t.vipTitle)+'</h3></div>'
      + '<p>'+esc(t.vipBody)+'</p>'
      + '<ul>'+bl+'</ul>'
      + '<p class="note" style="margin-top:12px;text-align:start">'+esc(t.vipNotice)+'</p>'
      + '<div class="sheet-btns"><button class="btn ghost" data-act="modal-stay">'+esc(t.close)+'</button><button class="btn" data-act="vip-activate">'+esc(t.vipActivate)+'</button></div></div>';
  }
  if (R.modal === "privacy"){
    return '<div class="scrim" data-act="modal-stay"></div>'
      + '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="crown" style="width:36px;height:36px;border-radius:12px;background:var(--soft);color:var(--blue-deep);display:grid;place-items:center">'+IC.shield+'</span><h3 id="mt" style="margin:0">'+esc(t.privacyTitle)+'</h3></div>'
      + '<ul>'+t.privacyRules.map(function(r){ return '<li>'+IC.check+'<span>'+esc(r)+'</span></li>'; }).join("")+'</ul>'
      + '<div class="sheet-btns"><button class="btn ghost" data-act="modal-stay">'+esc(t.close)+'</button></div></div>';
  }
  return "";
}

function content(){
  var t = T();
  if (R.tab === "home"){
    if (R.page && R.page.type === "book") return bookPage(R.page.id);
    if (R.page && R.page.type === "lesson") return lessonPage(R.page.n);
    if (R.page && R.page.type === "study") return studyPage(R.page.n, R.page.i);
    if (R.page && R.page.type === "story") return storyPage();
    if (R.page && R.page.type === "quiz") return quizPage();
    return homePage();
  }
  if (R.tab === "quizzes") return R.qrun ? quizRunPage() : quizCenter();
  if (R.tab === "activity") return activityPage();
  return profilePage();
}

function render(){
  applyPrefs();
  var app = document.getElementById("app");
  app.innerHTML = header() + '<main class="app">' + content() + '</main>' + tabbar() + modalHtml();
  bindFallbacks();
}

/* ---------- Actions ---------- */
function nextWord(n,i){
  var key = lessonKey(n,i);
  markLearned(key);
  saveState();
  if (i < 11){
    R.page = { type:"study", n:n, i:i+1 };
  } else {
    R.page = { type:"lesson", n:n };
    toast(T().lessonDone);
  }
  render();
}
function goTab(k){
  R = { tab:k, page:null, modal:null, reportSel:[], storyTr:false, playing:false, quiz:null, qrun:null };
  stopAudio(); render(); window.scrollTo(0,0);
}
function startQuiz(id){
  R.tab = "quizzes";
  R.qrun = { id:id, pos:0, sel:null, score:0, gain:false, done:false, counted:false };
  render(); window.scrollTo(0,0);
}

document.addEventListener("click", function(ev){
  var el = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el) return;
  var a = el.getAttribute("data-act");
  var t = T();
  var n1 = parseInt(el.getAttribute("data-n"),10);
  var i1 = parseInt(el.getAttribute("data-i"),10);

  if (a === "lang"){ S.lang = el.getAttribute("data-v"); saveState(); render(); return; }
  if (a === "theme"){ S.theme = S.theme === "dark" ? "light" : "dark"; saveState(); render(); return; }
  if (a === "tab"){ goTab(el.getAttribute("data-v")); return; }
  if (a === "toggle-hero"){ R.heroOpen = R.heroOpen === false; render(); return; }
  if (a === "start"){ R.tab = "home"; R.page = { type:"lesson", n:1 }; render(); window.scrollTo(0,0); return; }
  if (a === "open-book"){ R.tab = "home"; R.page = { type:"book", id:el.getAttribute("data-v") }; render(); window.scrollTo(0,0); return; }
  if (a === "open-lesson"){ R.page = { type:"lesson", n:n1 }; render(); window.scrollTo(0,0); return; }
  if (a === "back-home"){ R.page = null; R.quiz = null; stopAudio(); render(); return; }
  if (a === "back-book"){ R.page = { type:"book", id:"504" }; render(); return; }
  if (a === "back-lesson"){ R.page = { type:"lesson", n:n1 }; R.playing = false; stopAudio(); render(); window.scrollTo(0,0); return; }
  if (a === "continue"){ R.page = { type:"study", n:n1, i:firstUnlearned() }; render(); window.scrollTo(0,0); return; }
  if (a === "study"){ R.page = { type:"study", n:n1, i:i1 }; render(); window.scrollTo(0,0); return; }
  if (a === "bm-open"){ R = { tab:"home", page:{ type:"study", n:1, i:i1 }, modal:null, reportSel:[], storyTr:false, playing:false, quiz:null, qrun:null }; render(); window.scrollTo(0,0); return; }
  if (a === "next"){ nextWord(n1, i1); window.scrollTo(0,0); return; }
  if (a === "toggle-learn"){
    var lk = el.getAttribute("data-key");
    if (S.learned[lk]){ delete S.learned[lk]; }
    else { markLearned(lk); }
    saveState(); render(); return;
  }
  if (a === "say"){
    var acc = el.getAttribute("data-acc");
    var txt = el.getAttribute("data-text");
    if (acc === "female" || acc === "male") playWord(txt, acc);
    else if (acc === "slow") speak(txt, "slow");
    else speak(txt, "ex");
    return;
  }
  if (a === "bm"){
    var key = el.getAttribute("data-key");
    if (S.bookmarks[key]){ delete S.bookmarks[key]; toast(t.bmOff); }
    else { S.bookmarks[key] = true; toast(t.bmOn); }
    saveState(); render(); return;
  }
  if (a === "review"){
    var q = buildQuiz();
    if (!q){ toast(t.quizEmpty); return; }
    R = { tab:"home", page:{ type:"quiz" }, quiz:q, qrun:null, modal:null, reportSel:[], storyTr:false, playing:false };
    render(); window.scrollTo(0,0); return;
  }
  if (a === "quiz-ans"){
    var qz = R.quiz;
    if (!qz || qz.done) return;
    var cur = qz.queue[qz.pos];
    if (cur.answered !== null) return;
    var v = parseInt(el.getAttribute("data-v"),10);
    cur.answered = v;
    if (v === cur.correct){
      qz.solved++;
      if (!cur.retry) qz.firstTry++;
    } else {
      qz.wrong++;
      qz.queue.push(questionFor(cur.idx, true));
    }
    render(); return;
  }
  if (a === "quiz-next"){
    if (!R.quiz) return;
    R.quiz.pos++;
    if (R.quiz.pos >= R.quiz.queue.length) R.quiz.done = true;
    render(); window.scrollTo(0,0); return;
  }
  if (a === "quiz-restart"){
    var nq = buildQuiz();
    if (!nq){ R.page = null; R.quiz = null; toast(t.quizEmpty); render(); return; }
    R.quiz = nq; render(); window.scrollTo(0,0); return;
  }

  /* Quizzes tab */
  if (a === "topic"){
    var tid = el.getAttribute("data-v");
    var free = null;
    for (var qi=0;qi<QUIZZES.length;qi++){
      if (QUIZZES[qi].topic === tid && QUIZZES[qi].free){ free = QUIZZES[qi]; break; }
    }
    if (free) startQuiz(free.id); else { R.modal = "vip"; render(); }
    return;
  }
  if (a === "quiz-open"){ startQuiz(el.getAttribute("data-v")); return; }
  if (a === "quiz-restart-run"){ if (R.qrun){ startQuiz(R.qrun.id); } return; }
  if (a === "quiz-exit"){ R.qrun = null; R.tab = "quizzes"; render(); window.scrollTo(0,0); return; }
  if (a === "qopt"){
    var rr = R.qrun;
    if (!rr || rr.sel !== null || rr.done) return;
    var qq = findQuiz(rr.id);
    var itq = qq.items[rr.pos];
    var pick = parseInt(el.getAttribute("data-v"),10);
    rr.sel = pick;
    if (pick === itq.c){
      rr.score++;
      var gkey = "Q-" + rr.id + "-" + rr.pos;
      if (!S.awarded[gkey]){ rr.gain = true; awardPts(gkey, 5, null); saveState(); }
      else { rr.gain = false; }
    } else { rr.gain = false; }
    render(); return;
  }
  if (a === "qnext"){
    var rn = R.qrun;
    if (!rn) return;
    var qn = findQuiz(rn.id);
    rn.pos++;
    rn.gain = false;
    if (rn.pos >= qn.items.length){
      rn.done = true;
      if (!rn.counted){ rn.counted = true; S.quizzesDone++; saveState(); }
    } else {
      rn.sel = null;
    }
    render(); window.scrollTo(0,0); return;
  }

  if (a === "story"){ R.page = { type:"story", n:1 }; R.playing = false; render(); window.scrollTo(0,0); return; }
  if (a === "story-play"){
    if (R.playing){ stopAudio(); R.playing = false; render(); return; }
    R.playing = true; render();
    speak(el.getAttribute("data-text"), "story", function(){ R.playing = false; if (R.page && R.page.type === "story") render(); });
    return;
  }
  if (a === "story-tr"){ R.storyTr = !R.storyTr; render(); return; }
  if (a === "finish-lesson"){
    if (learnedInLesson(1) < 12){ toast(t.needAll); return; }
    if (S.done1){ toast(t.alreadyDone); }
    else { S.done1 = true; S.score += 20; saveState(); toast(t.bonusGot); }
    R.page = { type:"lesson", n:1 }; render(); window.scrollTo(0,0); return;
  }
  if (a === "ask-exit"){ R.modal = "exit"; render(); return; }
  if (a === "modal-stay"){ R.modal = null; render(); return; }
  if (a === "modal-exit"){ stopAudio(); R.modal = null; R.page = { type:"lesson", n:1 }; render(); window.scrollTo(0,0); return; }
  if (a === "report"){ R.modal = "report"; R.reportSel = []; render(); return; }
  if (a === "rep-toggle"){
    var rv = parseInt(el.getAttribute("data-v"),10);
    var pos = R.reportSel.indexOf(rv);
    if (pos >= 0) R.reportSel.splice(pos,1); else R.reportSel.push(rv);
    render(); return;
  }
  if (a === "rep-submit"){
    if (!R.reportSel.length){ toast(t.reportNone); return; }
    R.modal = null; R.reportSel = []; toast(t.reportOk); render(); return;
  }
  if (a === "save-name"){
    var inp = document.getElementById("nameIn");
    S.name = inp ? inp.value.trim() : S.name;
    saveState(); toast(t.nameSaved); render(); return;
  }
  if (a === "vip"){ R.modal = "vip"; render(); return; }
  if (a === "vip-activate"){ toast(t.vipSoon); return; }
  if (a === "privacy"){ R.modal = "privacy"; render(); return; }
  if (a === "soon"){ toast(t.soonToast); return; }
});

document.addEventListener("keydown", function(ev){
  if (ev.key !== "Enter" && ev.key !== " ") return;
  var el = ev.target;
  if (el && el.getAttribute && el.getAttribute("role") === "button" && el.hasAttribute("data-act") && el.tagName !== "INPUT"){
    ev.preventDefault(); el.click();
  }
});

/* ---------- Init ---------- */
S = loadState();
saveState();
render();
})();
</script>
</body>
</html>
